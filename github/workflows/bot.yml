name: Gift Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyTelegramBotAPI

      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
